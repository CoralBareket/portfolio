# The ONLY path to production. Started by hand: Actions tab → "Deploy to production" → Run workflow (on main).
# Every check runs first; if anything fails, nothing is deployed and production stays as it was.
name: Deploy to production

on:
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; never cancel one half-way.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, build and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SITE_URL: https://coralbareket.vercel.app

    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Set up Java (Firebase emulators)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile

      # ---------- Checks: any failure stops here, before anything is deployed ----------
      - name: Lint and formatting
        run: pnpm lint && pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API + Firestore rules tests (emulators)
        run: pnpm test:emulators

      - name: Build production output
        run: pnpm build:vercel
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          VITE_SITE_URL: ${{ env.SITE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Smoke tests on the production build (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      # ---------- Deploy (only reached when every check passed) ----------
      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" pnpm exec firebase deploy \
            --only firestore --project "$FIREBASE_PROJECT_ID" --config firebase/firebase.json --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Deploy site and API to Vercel
        run: pnpm exec vercel deploy --prebuilt --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Smoke test production
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$SITE_URL/api/health" | grep -q '"ok"'; then break; fi
            echo "waiting for deployment… ($i)"; sleep 10
          done
          curl -fsS "$SITE_URL/api/health" | grep -q '"ok"'
          curl -fsS "$SITE_URL/" | grep -q 'Coral Bareket'
          curl -fsS "$SITE_URL/api/content" | grep -q '"hero"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/admin/messages")" = "401"
          echo "✓ Production is up"
